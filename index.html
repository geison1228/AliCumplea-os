<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0" />
  <title>🎂 Feliz Cumpleaños Alli ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Inter:wght@200;300;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0008;
      font-family: 'Cormorant Garamond', serif;
      user-select: none;
      touch-action: none;
    }
    canvas#c {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }
    
    /* ============================================================
       TEXTO DE CUMPLEAÑOS - ARRIBA (GRANDE)
       ============================================================ */
    #birthdayText {
      position: fixed;
      top: 6%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      pointer-events: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 10vw, 6rem);
      font-weight: 700;
      font-style: italic;
      color: #fff;
      text-align: center;
      opacity: 0;
      transition: opacity 2s ease;
      text-shadow: 
        0 0 30px rgba(255, 105, 180, 1),
        0 0 60px rgba(255, 105, 180, 0.9),
        0 0 100px rgba(255, 105, 180, 0.7),
        0 0 150px rgba(200, 100, 255, 0.5),
        0 4px 20px rgba(0, 0, 0, 0.9);
      letter-spacing: 4px;
      line-height: 1.2;
      width: 90%;
    }
    #birthdayText.visible {
      opacity: 1;
      animation: neonPulse 2s ease-in-out infinite;
    }
    #birthdayText .sub {
      font-size: clamp(1.2rem, 3vw, 2.2rem);
      font-weight: 300;
      letter-spacing: 8px;
      opacity: .9;
      display: block;
      margin-top: 5px;
      text-shadow: 
        0 0 40px rgba(255, 105, 180, 1),
        0 0 80px rgba(255, 105, 180, 0.8),
        0 4px 20px rgba(0, 0, 0, 0.9);
    }
    @keyframes neonPulse {
      0%, 100% {
        text-shadow: 0 0 30px rgba(255, 105, 180, 1), 0 0 60px rgba(255, 105, 180, 0.9), 0 0 100px rgba(255, 105, 180, 0.7), 0 0 150px rgba(200, 100, 255, 0.5), 0 4px 20px rgba(0, 0, 0, 0.9);
        transform: translateX(-50%) scale(1);
      }
      50% {
        text-shadow: 0 0 50px rgba(255, 105, 180, 1), 0 0 80px rgba(255, 105, 180, 1), 0 0 120px rgba(255, 105, 180, 0.8), 0 0 200px rgba(200, 100, 255, 0.6), 0 4px 20px rgba(0, 0, 0, 0.9);
        transform: translateX(-50%) scale(1.02);
      }
    }

    /* ============================================================
       TEXTO FINAL - ABAJO (aparece al juntar las almas)
       ============================================================ */
    #finale {
      position: fixed;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
      text-align: center;
      opacity: 0;
      transition: opacity 2.2s ease;
      width: 90%;
    }
    #finale.visible {
      opacity: 1;
    }
    #finale .text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 20px 40px 25px;
      border-radius: 25px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 105, 180, 0.2);
      box-shadow: 0 0 60px rgba(255, 105, 180, 0.15);
    }
    #finale .line1 {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      font-weight: 200;
      letter-spacing: .5em;
      color: rgba(255, 220, 240, .95);
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 1), 0 0 30px rgba(255, 105, 180, .3);
    }
    #finale .line2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 7vw, 4.5rem);
      font-weight: 300;
      font-style: italic;
      color: #fff;
      line-height: 1.1;
      letter-spacing: .02em;
      text-shadow: 
        0 2px 10px rgba(0, 0, 0, 1),
        0 0 40px rgba(255, 105, 180, 1),
        0 0 80px rgba(255, 105, 180, 0.7),
        0 0 120px rgba(200, 100, 255, 0.4);
      animation: tpulse 3s ease-in-out infinite;
    }
    #finale .line3 {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.8rem, 2vw, 1rem);
      font-weight: 200;
      letter-spacing: .3em;
      color: rgba(255, 220, 240, .8);
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 1), 0 0 30px rgba(255, 105, 180, .3);
    }
    @keyframes tpulse {
      0%, 100% {
        text-shadow: 0 2px 10px rgba(0, 0, 0, 1), 0 0 40px rgba(255, 105, 180, .8), 0 0 80px rgba(200, 100, 255, .3);
      }
      50% {
        text-shadow: 0 2px 10px rgba(0, 0, 0, 1), 0 0 60px rgba(255, 105, 180, 1), 0 0 120px rgba(200, 100, 255, .6);
      }
    }

    /* ============================================================
       HINT (texto inferior)
       ============================================================ */
    #hint {
      position: fixed;
      bottom: clamp(18px, 3vh, 30px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.8rem, 2vw, 1rem);
      font-weight: 300;
      letter-spacing: .3em;
      color: rgba(255, 255, 255, 0.95);
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      transition: opacity 1.2s;
      text-shadow: 
        0 0 30px rgba(255, 105, 180, 0.8),
        0 0 60px rgba(255, 105, 180, 0.4),
        0 2px 10px rgba(0, 0, 0, 1);
      animation: hintPulse 2.5s ease-in-out infinite;
    }
    @keyframes hintPulse {
      0%, 100% { opacity: .7; }
      50% { opacity: 1; }
    }

    /* ============================================================
       BOTÓN REINICIAR
       ============================================================ */
    .replay-btn {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom, 24px));
      right: max(24px, env(safe-area-inset-right, 24px));
      z-index: 30;
      pointer-events: none;
      background: rgba(26, 0, 26, .55);
      border: 1px solid rgba(255, 180, 210, .4);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.3rem;
      color: rgba(255, 180, 210, .85);
      cursor: pointer;
      opacity: 0;
      transition: opacity 1.6s ease, border-color .25s, color .25s, transform .3s;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      touch-action: manipulation;
    }
    .replay-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .replay-btn:hover,
    .replay-btn:active {
      color: #fff;
      border-color: rgba(255, 105, 180, .8);
      transform: rotate(-40deg) scale(1.1);
    }

    /* ============================================================
       GLOBOS
       ============================================================ */
    .balloon {
      position: fixed;
      z-index: 2;
      pointer-events: none;
      font-size: clamp(35px, 7vw, 70px);
      animation: balloonFloat 15s ease-in-out infinite;
      opacity: 0;
      transition: opacity 2s ease;
    }
    .balloon.show {
      opacity: 0.7;
    }
    .balloon .message {
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Inter', sans-serif;
      font-size: clamp(8px, 1.2vw, 13px);
      color: #fff;
      white-space: nowrap;
      text-shadow: 0 0 30px rgba(255, 105, 180, 0.8), 0 2px 10px rgba(0, 0, 0, 1);
      background: rgba(0, 0, 0, .5);
      padding: 3px 14px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      letter-spacing: 1px;
      font-weight: 300;
      border: 1px solid rgba(255, 105, 180, .1);
    }
    @keyframes balloonFloat {
      0% { transform: translate(0, 0) rotate(-3deg); }
      25% { transform: translate(15px, -25px) rotate(2deg); }
      50% { transform: translate(-8px, -50px) rotate(-3deg); }
      75% { transform: translate(12px, -25px) rotate(3deg); }
      100% { transform: translate(0, 0) rotate(-3deg); }
    }
    .balloon:nth-child(odd) { animation-duration: 12s; }
    .balloon:nth-child(3n) { animation-duration: 18s; }
    .balloon:nth-child(5n+2) { animation-duration: 14s; }

    /* ============================================================
       CONFETI
       ============================================================ */
    .confetti-piece {
      position: fixed;
      z-index: 15;
      pointer-events: none;
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 600px) {
      #birthdayText {
        font-size: clamp(2rem, 10vw, 3.5rem);
        top: 5%;
      }
      #birthdayText .sub {
        font-size: clamp(1rem, 3vw, 1.6rem);
        letter-spacing: 4px;
      }
      #finale .text-group {
        padding: 15px 20px 20px;
        gap: 4px;
      }
      #finale .line2 {
        font-size: clamp(1.6rem, 6vw, 3rem);
      }
      #finale .line1 {
        font-size: clamp(0.7rem, 2vw, 0.9rem);
        letter-spacing: .3em;
      }
      #finale .line3 {
        font-size: clamp(0.6rem, 1.8vw, 0.8rem);
      }
      #hint {
        font-size: clamp(0.6rem, 1.8vw, 0.8rem);
        letter-spacing: .2em;
        bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <!-- TEXTO DE CUMPLEAÑOS (ARRIBA) -->
  <div id="birthdayText">
    🎂 Feliz Cumpleaños
    <span class="sub">✨ Alli ✨</span>
  </div>

  <!-- TEXTO FINAL (ABAJO) -->
  <div id="finale">
    <div class="text-group">
      <p class="line1">En 7 mil millones de personas</p>
      <h2 class="line2">"...te encontré a ti."</h2>
      <p class="line3">Eres mi universo entero</p>
    </div>
  </div>

  <!-- HINT -->
  <p id="hint">arrastra las almas para que se encuentren ✦</p>

  <!-- BOTÓN REINICIAR -->
  <button class="replay-btn" id="replayBtn" title="Comenzar de nuevo">↺</button>

  <script>
    // ============================================================
    // CÓDIGO PRINCIPAL - LIMPIO Y OPTIMIZADO
    // ============================================================

    document.addEventListener('DOMContentLoaded', function() {

      // --- REFERENCIAS ---
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d', { alpha: false });
      const finaleEl = document.getElementById('finale');
      const hintEl = document.getElementById('hint');
      const birthdayText = document.getElementById('birthdayText');
      const replayBtn = document.getElementById('replayBtn');

      let W, H, dpr;
      let merged = false,
        mergeTime = 0,
        lastBeatT = 0,
        lastInteract = 0;
      let separating = false,
        separateStart = 0;
      const mergeLock = { x: 0, y: 0 };
      let tiltX = 0,
        tiltY = 0;
      let heartProgress = 0,
        heartFill = 0;
      let heartScale = 0;

      // --- ALMAS ---
      const soulA = {
        x: 0, y: 0, tx: 0, ty: 0, radius: 22,
        isDragging: false, touchId: null,
        r: 255, g: 105, b: 180,
        scaredVx: 0, scaredVy: 0, scared: false
      };
      const soulB = {
        x: 0, y: 0, tx: 0, ty: 0, radius: 22,
        isDragging: false, touchId: null,
        r: 200, g: 100, b: 255,
        scaredVx: 0, scaredVy: 0, scared: false
      };

      // --- CORAZÓN ---
      const HEART_RES = 200;
      const hpx = new Float32Array(HEART_RES);
      const hpy = new Float32Array(HEART_RES);

      function buildHeartPts() {
        for (let i = 0; i < HEART_RES; i++) {
          const t = (i / HEART_RES) * Math.PI * 2;
          hpx[i] = 16 * Math.pow(Math.sin(t), 3);
          hpy[i] = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        }
      }

      function computeHeartScale(now) {
        const base = (Math.min(W, H) * 0.35) / 32;
        const cycle = (now * 0.0013) % 1;
        let pulse = 0;
        if (cycle < 0.12) pulse = Math.sin((cycle / 0.12) * Math.PI);
        else if (cycle > 0.18 && cycle < 0.35) pulse = 0.5 * Math.sin(((cycle - 0.18) / 0.17) * Math.PI);
        return base * (1 + pulse * 0.1);
      }

      // --- ESTRELLAS DE FONDO (simples) ---
      const NS = 120;
      const stX = new Float32Array(NS), stY = new Float32Array(NS),
        stR = new Float32Array(NS), stSp = new Float32Array(NS),
        stOf = new Float32Array(NS), stPr = new Float32Array(NS);

      function initStars() {
        for (let i = 0; i < NS; i++) {
          stX[i] = Math.random() * W;
          stY[i] = Math.random() * H;
          stR[i] = Math.random() * 0.8 + 0.2;
          stSp[i] = Math.random() * 0.008 + 0.002;
          stOf[i] = Math.random() * 6.28;
          stPr[i] = Math.random() * 0.2 + 0.05;
        }
      }

      function drawStars(t) {
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 0.4;
        ctx.beginPath();
        for (let i = 0; i < NS; i++) {
          const tw = Math.sin(t * stSp[i] * 60 + stOf[i]) * 0.2 + 0.8;
          const px = stX[i] + tiltX * stPr[i], py = stY[i] + tiltY * stPr[i];
          const rr = stR[i] * tw;
          ctx.moveTo(px + rr, py);
          ctx.arc(px, py, rr, 0, 6.2832);
        }
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // --- PARTÍCULAS (reducidas) ---
      const N = 200, F = 10;
      const pA = new Float32Array(N * F), pB = new Float32Array(N * F);
      const ptBuf = new Float32Array(N * 3);

      function resetP(arr, i, ox, oy) {
        const o = i * F, a = Math.random() * 6.2832, r = Math.random() * 30 + 6;
        arr[o] = ox + Math.cos(a) * r;
        arr[o + 1] = oy + Math.sin(a) * r;
        arr[o + 2] = (Math.random() - .5) * 0.4;
        arr[o + 3] = (Math.random() - .5) * 0.4;
        arr[o + 4] = Math.random() * 0.4 + 0.4;
        arr[o + 5] = Math.random() * 0.003 + 0.0015;
        arr[o + 6] = Math.random() * 1 + 0.3;
        arr[o + 7] = Math.random() * 6.2832;
        arr[o + 8] = Math.random() * 28 + 6;
        arr[o + 9] = (Math.random() - .5) * 0.01;
      }

      function initParticles() {
        for (let i = 0; i < N; i++) {
          resetP(pA, i, soulA.x, soulA.y);
          resetP(pB, i, soulB.x, soulB.y);
        }
      }

      function updateDrawParticles(heartActive, cx, cy, hs) {
        ctx.globalCompositeOperation = 'screen';
        let c = 0;
        // Partículas A (rosa)
        for (let i = 0; i < N; i++) {
          const o = i * F;
          let vx = pA[o + 2], vy = pA[o + 3];
          if (heartActive) {
            const hi = (i * 7) & (HEART_RES - 1);
            vx += (cx + hpx[hi] * hs - pA[o]) * 0.007;
            vy += (cy + hpy[hi] * hs - pA[o + 1]) * 0.007;
          } else {
            pA[o + 7] += pA[o + 9];
            vx += (soulA.x + Math.cos(pA[o + 7]) * pA[o + 8] - pA[o]) * 0.035;
            vy += (soulA.y + Math.sin(pA[o + 7]) * pA[o + 8] - pA[o + 1]) * 0.035;
          }
          pA[o + 2] = vx * 0.88;
          pA[o + 3] = vy * 0.88;
          pA[o] += pA[o + 2];
          pA[o + 1] += pA[o + 3];
          pA[o + 4] -= pA[o + 5];
          if (pA[o + 4] <= 0) { resetP(pA, i, soulA.x, soulA.y); continue; }
          ptBuf[c * 3] = pA[o];
          ptBuf[c * 3 + 1] = pA[o + 1];
          ptBuf[c * 3 + 2] = pA[o + 6];
          c++;
        }
        ctx.fillStyle = 'rgba(255,105,180,0.6)';
        ctx.beginPath();
        for (let i = 0; i < c; i++) {
          const r = ptBuf[i * 3 + 2];
          ctx.moveTo(ptBuf[i * 3] + r, ptBuf[i * 3 + 1]);
          ctx.arc(ptBuf[i * 3], ptBuf[i * 3 + 1], r, 0, 6.2832);
        }
        ctx.fill();
        // Partículas B (púrpura)
        c = 0;
        for (let i = 0; i < N; i++) {
          const o = i * F;
          let vx = pB[o + 2], vy = pB[o + 3];
          if (heartActive) {
            const hi = ((i + 128) * 7) & (HEART_RES - 1);
            vx += (cx + hpx[hi] * hs - pB[o]) * 0.007;
            vy += (cy + hpy[hi] * hs - pB[o + 1]) * 0.007;
          } else {
            pB[o + 7] += pB[o + 9];
            vx += (soulB.x + Math.cos(pB[o + 7]) * pB[o + 8] - pB[o]) * 0.035;
            vy += (soulB.y + Math.sin(pB[o + 7]) * pB[o + 8] - pB[o + 1]) * 0.035;
          }
          pB[o + 2] = vx * 0.88;
          pB[o + 3] = vy * 0.88;
          pB[o] += pB[o + 2];
          pB[o + 1] += pB[o + 3];
          pB[o + 4] -= pB[o + 5];
          if (pB[o + 4] <= 0) { resetP(pB, i, soulB.x, soulB.y); continue; }
          ptBuf[c * 3] = pB[o];
          ptBuf[c * 3 + 1] = pB[o + 1];
          ptBuf[c * 3 + 2] = pB[o + 6];
          c++;
        }
        ctx.fillStyle = 'rgba(200,100,255,0.6)';
        ctx.beginPath();
        for (let i = 0; i < c; i++) {
          const r = ptBuf[i * 3 + 2];
          ctx.moveTo(ptBuf[i * 3] + r, ptBuf[i * 3 + 1]);
          ctx.arc(ptBuf[i * 3], ptBuf[i * 3 + 1], r, 0, 6.2832);
        }
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }

      // --- NEBULOSAS (solo al juntarse) ---
      const MN = 8;
      const nX = new Float32Array(MN), nY = new Float32Array(MN),
        nVX = new Float32Array(MN), nVY = new Float32Array(MN),
        nR = new Float32Array(MN), nAl = new Float32Array(MN),
        nD = new Float32Array(MN), nHue = new Uint8Array(MN);
      let nebN = 0;

      function spawnNebulas(x, y) {
        for (let i = 0; i < MN; i++) {
          nX[i] = x; nY[i] = y;
          nVX[i] = (Math.random() - .5) * 2;
          nVY[i] = (Math.random() - .5) * 2 - 0.5;
          nR[i] = Math.random() * 40 + 15;
          nAl[i] = 0.18;
          nD[i] = Math.random() * 0.003 + 0.002;
          nHue[i] = Math.random() > 0.5 ? 1 : 0;
        }
        nebN = MN;
      }

      function drawNebulas() {
        if (!nebN) return;
        ctx.globalCompositeOperation = 'screen';
        let alive = 0;
        for (let i = 0; i < nebN; i++) {
          nX[i] += nVX[i]; nY[i] += nVY[i];
          nVX[i] *= 0.99; nVY[i] *= 0.99;
          nR[i] += 0.3;
          nAl[i] -= nD[i];
          if (nAl[i] <= 0) continue;
          if (alive < i) {
            nX[alive] = nX[i]; nY[alive] = nY[i];
            nVX[alive] = nVX[i]; nVY[alive] = nVY[i];
            nR[alive] = nR[i]; nAl[alive] = nAl[i];
            nD[alive] = nD[i]; nHue[alive] = nHue[i];
          }
          const g = ctx.createRadialGradient(nX[alive], nY[alive], 0, nX[alive], nY[alive], nR[alive]);
          g.addColorStop(0, `hsla(${nHue[alive] ? 320 : 280},100%,72%,${nAl[alive].toFixed(3)})`);
          g.addColorStop(1, 'hsla(0,0%,0%,0)');
          ctx.beginPath();
          ctx.arc(nX[alive], nY[alive], nR[alive], 0, 6.2832);
          ctx.fillStyle = g;
          ctx.fill();
          alive++;
        }
        nebN = alive;
        ctx.globalCompositeOperation = 'source-over';
      }

      // --- CORAZONES VOLADORES (pocos) ---
      const MFH = 30;
      const fX = new Float32Array(MFH), fY = new Float32Array(MFH),
        fVX = new Float32Array(MFH), fVY = new Float32Array(MFH),
        fS = new Float32Array(MFH), fA = new Float32Array(MFH),
        fD = new Float32Array(MFH), fC = new Uint8Array(MFH);
      let fhN = 0;

      function spawnFH(x, y, count) {
        for (let i = 0; i < count && fhN < MFH; i++, fhN++) {
          fX[fhN] = x + (Math.random() - 0.5) * 20;
          fY[fhN] = y + (Math.random() - 0.5) * 20;
          fVX[fhN] = (Math.random() - .5) * 3;
          fVY[fhN] = -Math.random() * 4 - 1;
          fS[fhN] = Math.random() * 7 + 3;
          fA[fhN] = 1;
          fD[fhN] = Math.random() * 0.01 + 0.005;
          fC[fhN] = Math.random() > 0.5 ? 1 : 0;
        }
      }

      function drawHeartShape(x, y, s, col) {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(x, y - s * 0.25);
        ctx.bezierCurveTo(x - s * 0.5, y - s * 0.75, x - s, y - s * 0.33, x - s, y);
        ctx.bezierCurveTo(x - s, y + s * 0.5, x - s * 0.33, y + s * 0.83, x, y + s);
        ctx.bezierCurveTo(x + s * 0.33, y + s * 0.83, x + s, y + s * 0.5, x + s, y);
        ctx.bezierCurveTo(x + s, y - s * 0.33, x + s * 0.5, y - s * 0.75, x, y - s * 0.25);
        ctx.closePath();
        ctx.fill();
      }

      function drawFH() {
        let alive = 0;
        for (let i = 0; i < fhN; i++) {
          fX[i] += fVX[i]; fY[i] += fVY[i];
          fVX[i] *= 0.96; fVY[i] *= 0.97;
          fA[i] -= fD[i];
          if (fA[i] <= 0) continue;
          if (alive < i) {
            fX[alive] = fX[i]; fY[alive] = fY[i];
            fVX[alive] = fVX[i]; fVY[alive] = fVY[i];
            fS[alive] = fS[i]; fA[alive] = fA[i];
            fD[alive] = fD[i]; fC[alive] = fC[i];
          }
          ctx.globalAlpha = fA[alive];
          drawHeartShape(fX[alive], fY[alive], fS[alive], fC[alive] ? '#ff69b4' : '#c084fc');
          alive++;
        }
        fhN = alive;
        ctx.globalAlpha = 1;
      }

      // --- ONDAS EXPANSIVAS ---
      const MSW = 2;
      const swX = new Float32Array(MSW), swY = new Float32Array(MSW),
        swR = new Float32Array(MSW), swA = new Float32Array(MSW),
        swMR = new Float32Array(MSW);
      let swN = 0;

      function spawnSW(x, y, maxR, a) {
        if (swN >= MSW) return;
        swX[swN] = x; swY[swN] = y;
        swR[swN] = 0; swA[swN] = a;
        swMR[swN] = maxR;
        swN++;
      }

      function drawSW() {
        if (!swN) return;
        let alive = 0;
        for (let i = 0; i < swN; i++) {
          swR[i] += swMR[i] * 0.04;
          swA[i] -= 0.02;
          if (swA[i] <= 0) continue;
          if (alive < i) {
            swX[alive] = swX[i]; swY[alive] = swY[i];
            swR[alive] = swR[i]; swA[alive] = swA[i];
            swMR[alive] = swMR[i];
          }
          ctx.beginPath();
          ctx.arc(swX[alive], swY[alive], swR[alive], 0, 6.2832);
          ctx.strokeStyle = `rgba(255,200,240,${swA[alive].toFixed(3)})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
          alive++;
        }
        swN = alive;
      }

      // --- CORAZÓN GRANDE ---
      function drawBigHeart(cx, cy, hs, progress, fill, now) {
        if (progress <= 0) return;
        const maxMult = Math.min(W, H) * 0.85 / (32 * hs);
        const BM = Math.min(1.8, maxMult);
        const s = hs * BM;
        const pts = Math.min(HEART_RES, (progress * HEART_RES + 1) | 0);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.beginPath();
        ctx.moveTo(hpx[0] * s, hpy[0] * s);
        for (let i = 1; i < pts; i++) ctx.lineTo(hpx[i] * s, hpy[i] * s);
        if (progress >= 0.99) ctx.closePath();
        const strokeAlpha = progress >= 0.99 ? 0.5 + Math.sin(now * 0.002) * 0.2 : 0.6;
        ctx.strokeStyle = `rgba(255,255,255,${strokeAlpha.toFixed(3)})`;
        ctx.lineWidth = 2;
        ctx.shadowColor = 'rgba(255,105,180,0.8)';
        ctx.shadowBlur = 15;
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(hpx[0] * s, hpy[0] * s);
        for (let i = 1; i < pts; i++) ctx.lineTo(hpx[i] * s, hpy[i] * s);
        if (progress >= 0.99) ctx.closePath();
        const glowGrad = ctx.createLinearGradient(-s * 16, 0, s * 16, 0);
        glowGrad.addColorStop(0, 'rgba(200,100,255,0.4)');
        glowGrad.addColorStop(0.5, 'rgba(255,105,180,0.4)');
        glowGrad.addColorStop(1, 'rgba(200,100,255,0.4)');
        ctx.strokeStyle = glowGrad;
        ctx.lineWidth = 1;
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.stroke();
        ctx.restore();
      }

      // --- DIBUJAR ALMA ---
      function drawSoul(s, now) {
        const pulse = Math.sin(now * 0.002) * 0.08 + 0.92;
        const x = s.x, y = s.y, r = s.radius;
        const rc = s.r, gc = s.g, bc = s.b;
        const g1 = ctx.createRadialGradient(x, y, 0, x, y, r * 3.5 * pulse);
        g1.addColorStop(0, `rgba(${rc},${gc},${bc},0.12)`);
        g1.addColorStop(1, `rgba(${rc},${gc},${bc},0)`);
        ctx.beginPath();
        ctx.arc(x, y, r * 3.5 * pulse, 0, 6.2832);
        ctx.fillStyle = g1;
        ctx.fill();
        const g2 = ctx.createRadialGradient(x, y, 0, x, y, r * 1.5);
        g2.addColorStop(0, 'rgba(255,255,255,0.9)');
        g2.addColorStop(0.35, `rgba(${rc},${gc},${bc},1)`);
        g2.addColorStop(1, `rgba(${rc},${gc},${bc},0)`);
        ctx.beginPath();
        ctx.arc(x, y, r * 1.5, 0, 6.2832);
        ctx.fillStyle = g2;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y, r * 0.4, 0, 6.2832);
        ctx.fillStyle = '#fff';
        ctx.fill();
      }

      // --- HILO ---
      function drawThread(now, dist, thr) {
        const op = Math.min(1, (thr - dist) / 60) * 0.35;
        if (op <= 0) return;
        ctx.beginPath();
        ctx.moveTo(soulA.x, soulA.y);
        const mx = (soulA.x + soulB.x) / 2 + Math.sin(now * 0.003) * 8;
        const my = (soulA.y + soulB.y) / 2 + Math.cos(now * 0.003) * 8;
        ctx.quadraticCurveTo(mx, my, soulB.x, soulB.y);
        ctx.strokeStyle = `rgba(255,255,255,${op.toFixed(3)})`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      // --- POSICIONAR ALMAS ---
      function placeSouls() {
        if (W < H) {
          soulA.x = W * 0.5; soulA.y = H * 0.32;
          soulB.x = W * 0.5; soulB.y = H * 0.68;
        } else {
          soulA.x = W * 0.3; soulA.y = H * 0.5;
          soulB.x = W * 0.7; soulB.y = H * 0.5;
        }
        soulA.tx = soulA.x; soulA.ty = soulA.y;
        soulB.tx = soulB.x; soulB.ty = soulB.y;
        soulA.scaredVx = 0; soulA.scaredVy = 0; soulA.scared = false;
        soulB.scaredVx = 0; soulB.scaredVy = 0; soulB.scared = false;
      }

      // --- SEPARAR ---
      function beginSeparation() {
        if (!merged || separating) return;
        separating = true;
        separateStart = performance.now();
        finaleEl.classList.remove('visible');
        hintEl.style.opacity = '0';
        replayBtn.classList.remove('visible');
        birthdayText.classList.remove('visible');
      }

      function finishSeparation() {
        separating = false;
        merged = false;
        heartProgress = 0;
        heartFill = 0;
        nebN = 0;
        fhN = 0;
        swN = 0;
        const cx = mergeLock.x, cy = mergeLock.y;
        if (W < H) {
          soulA.x = cx; soulA.y = cy - H * 0.2;
          soulB.x = cx; soulB.y = cy + H * 0.2;
        } else {
          soulA.x = cx - W * 0.2; soulA.y = cy;
          soulB.x = cx + W * 0.2; soulB.y = cy;
        }
        soulA.tx = soulA.x; soulA.ty = soulA.y;
        soulB.tx = soulB.x; soulB.ty = soulB.y;
        initParticles();
        hintEl.textContent = 'arrastra las almas para que se encuentren ✦';
        hintEl.style.opacity = '1';
      }

      // --- REINICIAR ---
      function resetAll() {
        separating = false;
        merged = false;
        heartProgress = 0;
        heartFill = 0;
        nebN = 0;
        fhN = 0;
        swN = 0;
        finaleEl.classList.remove('visible');
        birthdayText.classList.remove('visible');
        hintEl.textContent = 'arrastra las almas para que se encuentren ✦';
        hintEl.style.opacity = '1';
        replayBtn.classList.remove('visible');
        placeSouls();
        initParticles();
      }

      // --- CONFETI (poco) ---
      const COLORS = ['#ff1493', '#ff69b4', '#ff6b6b', '#ff3366', '#ff1744'];

      function createConfetti(x, y, count) {
        count = count || 50;
        for (let i = 0; i < count; i++) {
          const el = document.createElement('div');
          el.className = 'confetti-piece';
          const color = COLORS[Math.floor(Math.random() * COLORS.length)];
          const size = Math.random() * 6 + 3;
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          el.style.width = size + 'px';
          el.style.height = size * (Math.random() * 0.5 + 0.5) + 'px';
          el.style.background = color;
          el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          const duration = Math.random() * 1.5 + 1.5;
          const tx = (Math.random() - 0.5) * 300;
          const ty = Math.random() * 300 + 150;
          const rot = Math.random() * 720;
          el.animate([
            { transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1 },
            { transform: `translate(${tx}px,${ty}px) rotate(${rot}deg) scale(0.3)`, opacity: 0 }
          ], { duration: duration * 1000, easing: 'cubic-bezier(0.2,0.8,0.4,1)', fill: 'forwards' });
          document.body.appendChild(el);
          setTimeout(() => el.remove(), duration * 1000 + 100);
        }
      }

      // --- GLOBOS ---
      function createBalloons() {
        const messages = ['💕', '✨', '🌹', '💖', '🌟', '🎂', '💗'];
        const container = document.createElement('div');
        container.id = 'balloonsContainer';
        document.body.appendChild(container);
        for (let i = 0; i < 6; i++) {
          const el = document.createElement('div');
          el.className = 'balloon';
          el.textContent = '🎈';
          el.style.left = (Math.random() * 85 + 7) + '%';
          el.style.top = (Math.random() * 40 + 55) + '%';
          el.style.animationDelay = (Math.random() * 8) + 's';
          el.style.fontSize = (Math.random() * 25 + 35) + 'px';
          const msg = document.createElement('div');
          msg.className = 'message';
          msg.textContent = messages[i % messages.length];
          el.appendChild(msg);
          setTimeout(() => el.classList.add('show'), Math.random() * 2000 + 500);
          container.appendChild(el);
        }
      }

      // --- RENDER ---
      function render(now) {
        requestAnimationFrame(render);

        ctx.fillStyle = 'rgba(10,0,8,0.12)';
        ctx.fillRect(0, 0, W, H);

        drawStars(now);
        heartScale = computeHeartScale(now);

        // Movimiento suave de las almas
        const idle = now - lastInteract;
        if (idle > 2000 && !soulA.isDragging && !soulB.isDragging && !merged) {
          const t = now * 0.001;
          if (W < H) {
            soulA.tx = W * 0.5 + Math.cos(t * 0.8) * 18;
            soulA.ty = H * 0.32 + Math.sin(t * 1.0) * 14;
            soulB.tx = W * 0.5 - Math.cos(t * 0.8) * 18;
            soulB.ty = H * 0.68 + Math.cos(t * 1.0) * 14;
          } else {
            soulA.tx = W * 0.3 + Math.cos(t * 1.0) * 18;
            soulA.ty = H * 0.5 + Math.sin(t * 0.8) * 14;
            soulB.tx = W * 0.7 - Math.cos(t * 1.0) * 18;
            soulB.ty = H * 0.5 - Math.sin(t * 0.8) * 14;
          }
        }

        if (!merged) {
          for (const s of [soulA, soulB]) {
            if (!s.isDragging) {
              s.scaredVx *= 0.85;
              s.scaredVy *= 0.85;
              if (!s.scared) {
                s.tx += s.scaredVx * 0.3;
                s.ty += s.scaredVy * 0.3;
              }
            }
          }
        }

        if (separating) {
          const t = Math.min(1, (now - separateStart) / 1200);
          const spread = t * Math.min(W, H) * 0.22;
          const angle = W < H ? Math.PI / 2 : 0;
          const tx1 = mergeLock.x - Math.cos(angle) * spread, ty1 = mergeLock.y - Math.sin(angle) * spread;
          const tx2 = mergeLock.x + Math.cos(angle) * spread, ty2 = mergeLock.y + Math.sin(angle) * spread;
          soulA.x += (tx1 - soulA.x) * 0.07;
          soulA.y += (ty1 - soulA.y) * 0.07;
          soulB.x += (tx2 - soulB.x) * 0.07;
          soulB.y += (ty2 - soulB.y) * 0.07;
        } else if (merged) {
          if (soulA.isDragging) { mergeLock.x = soulA.tx; mergeLock.y = soulA.ty; }
          else if (soulB.isDragging) { mergeLock.x = soulB.tx; mergeLock.y = soulB.ty; }
          const dragging = soulA.isDragging || soulB.isDragging;
          const lf = dragging ? 0.3 : 0.06;
          soulA.x += (mergeLock.x - soulA.x) * lf;
          soulA.y += (mergeLock.y - soulA.y) * lf;
          soulB.x += (mergeLock.x - soulB.x) * lf;
          soulB.y += (mergeLock.y - soulB.y) * lf;
        } else {
          const lf = 0.06;
          soulA.x += (soulA.tx - soulA.x) * lf;
          soulA.y += (soulA.ty - soulA.y) * lf;
          soulB.x += (soulB.tx - soulB.x) * lf;
          soulB.y += (soulB.ty - soulB.y) * lf;
        }

        const dist = Math.hypot(soulB.x - soulA.x, soulB.y - soulA.y);
        const THR = W < H ? 200 : 210;
        const heartActive = dist < THR;
        const cx = (soulA.x + soulB.x) / 2, cy = (soulA.y + soulB.y) / 2;

        const tdist = Math.hypot(soulB.tx - soulA.tx, soulB.ty - soulA.ty);
        if (!merged && !separating && tdist < 50) {
          merged = true;
          mergeTime = now;
          mergeLock.x = cx;
          mergeLock.y = cy;
          soulA.tx = cx;
          soulA.ty = cy;
          soulB.tx = cx;
          soulB.ty = cy;
          spawnNebulas(cx, cy);
          spawnFH(cx, cy, 12);
          spawnSW(cx, cy, Math.max(W, H) * 0.6, 0.7);
          spawnSW(cx, cy, Math.max(W, H) * 0.35, 0.35);

          birthdayText.classList.add('visible');

          setTimeout(() => {
            createConfetti(cx, cy, 50);
          }, 400);

          setTimeout(() => {
            finaleEl.classList.add('visible');
            replayBtn.classList.add('visible');
            hintEl.textContent = '✦ se encontraron ✦';
            hintEl.style.opacity = '1';
          }, 1000);
        }

        if (separating) {
          const elapsed = now - separateStart;
          const dur = 1200;
          const t = Math.min(1, elapsed / dur);
          heartProgress = Math.max(0, 1 - t);
          heartFill = Math.max(0, heartFill - 0.02);
          if (t >= 1) finishSeparation();
        } else if (merged) {
          const el = now - mergeTime;
          if (el > 400) heartProgress = Math.min(1, (el - 400) / 1500);
          if (heartProgress >= 0.99) heartFill = Math.min(1, heartFill + 0.006);
        }

        if ((merged || separating) && heartProgress > 0) {
          drawBigHeart(cx, cy, heartScale, heartProgress, heartFill, now);
        }

        drawSW();
        if (heartActive && !merged) drawThread(now, dist, THR);
        drawNebulas();
        updateDrawParticles(heartActive, cx, cy, heartScale);
        drawFH();

        if (merged && !separating && now - lastBeatT > 800) {
          lastBeatT = now;
          spawnFH(cx, cy, 1);
        }

        ctx.globalCompositeOperation = 'screen';
        drawSoul(soulA, now);
        drawSoul(soulB, now);
        ctx.globalCompositeOperation = 'source-over';

        // Etiquetas TÚ / YO
        if (!merged) {
          const fs = Math.max(12, Math.min(15, W * 0.035));
          ctx.save();
          ctx.font = '300 ' + fs + 'px Inter,sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.shadowColor = 'rgba(255,105,180,0.8)';
          ctx.shadowBlur = 15;
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.fillText('TÚ', soulA.x, soulA.y - soulA.radius - fs - 4);
          ctx.shadowColor = 'rgba(200,100,255,0.8)';
          ctx.shadowBlur = 15;
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          ctx.fillText('YO', soulB.x, soulB.y - soulB.radius - fs - 4);
          ctx.restore();
        }
      }

      // --- EVENTOS ---
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#0a0008';
        ctx.fillRect(0, 0, W, H);
        buildHeartPts();
        initStars();
        if (!merged) { placeSouls();
          initParticles(); }
      }

      function shy(s, px, py) {
        if (merged) return;
        const d = Math.hypot(s.x - px, s.y - py);
        if (d < 80) {
          const a = Math.atan2(s.y - py, s.x - px);
          s.scaredVx += Math.cos(a) * 0.7;
          s.scaredVy += Math.sin(a) * 0.7;
          s.scared = true;
        } else s.scared = false;
      }

      const LIFT = -40;

      function tp(t) {
        const r = canvas.getBoundingClientRect();
        return { x: t.clientX - r.left, y: t.clientY - r.top };
      }

      // TOUCH
      canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        lastInteract = performance.now();
        if (merged) {
          for (const t of e.changedTouches) {
            const p = tp(t);
            if (e.touches.length >= 2) {
              if (soulA.touchId === null) {
                soulA.isDragging = true;
                soulA.touchId = t.identifier;
                soulA.tx = p.x;
                soulA.ty = p.y + LIFT;
              } else if (soulB.touchId === null) {
                soulB.isDragging = true;
                soulB.touchId = t.identifier;
                soulB.tx = p.x;
                soulB.ty = p.y + LIFT;
              }
            } else {
              if (soulA.touchId === null) {
                soulA.isDragging = true;
                soulA.touchId = t.identifier;
                soulA.tx = p.x;
                soulA.ty = p.y + LIFT;
                soulB.tx = p.x;
                soulB.ty = p.y + LIFT;
                mergeLock.x = p.x;
                mergeLock.y = p.y + LIFT;
              }
            }
          }
          return;
        }
        for (const t of e.changedTouches) {
          const p = tp(t);
          const dA = Math.hypot(soulA.x - p.x, soulA.y - p.y),
            dB = Math.hypot(soulB.x - p.x, soulB.y - p.y);
          if (dA < dB) {
            if (dA < 90 && soulA.touchId === null) {
              soulA.isDragging = true;
              soulA.touchId = t.identifier;
              soulA.tx = p.x;
              soulA.ty = p.y + LIFT;
            } else if (dB < 90 && soulB.touchId === null) {
              soulB.isDragging = true;
              soulB.touchId = t.identifier;
              soulB.tx = p.x;
              soulB.ty = p.y + LIFT;
            }
          } else {
            if (dB < 90 && soulB.touchId === null) {
              soulB.isDragging = true;
              soulB.touchId = t.identifier;
              soulB.tx = p.x;
              soulB.ty = p.y + LIFT;
            } else if (dA < 90 && soulA.touchId === null) {
              soulA.isDragging = true;
              soulA.touchId = t.identifier;
              soulA.tx = p.x;
              soulA.ty = p.y + LIFT;
            }
          }
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        lastInteract = performance.now();
        const twoFinger = merged && e.touches.length >= 2 && soulA.isDragging && soulB.isDragging;
        for (const t of e.touches) {
          const p = tp(t);
          if (soulA.isDragging && soulA.touchId === t.identifier) {
            soulA.tx = p.x;
            soulA.ty = p.y + LIFT;
            if (merged && !twoFinger) {
              soulB.tx = p.x;
              soulB.ty = p.y + LIFT;
              mergeLock.x = p.x;
              mergeLock.y = p.y + LIFT;
            }
          }
          if (soulB.isDragging && soulB.touchId === t.identifier) {
            soulB.tx = p.x;
            soulB.ty = p.y + LIFT;
            if (merged && !twoFinger) {
              soulA.tx = p.x;
              soulA.ty = p.y + LIFT;
              mergeLock.x = p.x;
              mergeLock.y = p.y + LIFT;
            }
          }
        }
      }, { passive: false });

      canvas.addEventListener('touchend', function(e) {
        e.preventDefault();
        for (const t of e.changedTouches) {
          if (soulA.touchId === t.identifier) {
            soulA.isDragging = false;
            soulA.touchId = null;
          }
          if (soulB.touchId === t.identifier) {
            soulB.isDragging = false;
            soulB.touchId = null;
          }
        }
        if (merged && !soulA.isDragging && !soulB.isDragging) {
          const pullDist = Math.hypot(soulB.tx - soulA.tx, soulB.ty - soulA.ty);
          if (pullDist > 120) beginSeparation();
        }
      });

      // MOUSE
      let activeNode = null;
      canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

      canvas.addEventListener('mousedown', function(e) {
        lastInteract = performance.now();
        if (merged) {
          if (e.button === 2) {
            beginSeparation();
            return;
          }
          soulA.isDragging = true;
          soulB.isDragging = true;
          activeNode = soulA;
          return;
        }
        const dA = Math.hypot(soulA.x - e.clientX, soulA.y - e.clientY);
        const dB = Math.hypot(soulB.x - e.clientX, soulB.y - e.clientY);
        if (dA < dB && dA < 70) {
          soulA.isDragging = true;
          activeNode = soulA;
        } else if (dB < 70) {
          soulB.isDragging = true;
          activeNode = soulB;
        }
      });

      window.addEventListener('mousemove', function(e) {
        lastInteract = performance.now();
        if (activeNode) {
          activeNode.tx = e.clientX;
          activeNode.ty = e.clientY;
          if (merged) {
            soulA.tx = e.clientX;
            soulA.ty = e.clientY;
            soulB.tx = e.clientX;
            soulB.ty = e.clientY;
            mergeLock.x = e.clientX;
            mergeLock.y = e.clientY;
          }
        } else {
          shy(soulA, e.clientX, e.clientY);
          shy(soulB, e.clientX, e.clientY);
        }
      });

      window.addEventListener('mouseup', function(e) {
        if (activeNode) {
          activeNode.isDragging = false;
          soulA.isDragging = false;
          soulB.isDragging = false;
          activeNode = null;
        }
      });

      window.addEventListener('deviceorientation', function(e) {
        tiltX = (e.gamma || 0) * 0.4;
        tiltY = (e.beta || 0) * 0.2;
      });

      window.addEventListener('resize', resize);

      replayBtn.addEventListener('click', function() {
        finaleEl.classList.remove('visible');
        replayBtn.classList.remove('visible');
        birthdayText.classList.remove('visible');
        setTimeout(function() { resetAll(); }, 400);
      });

      // --- INICIAR ---
      createBalloons();
      resize();
      requestAnimationFrame(render);

    });
  </script>
</body>
</html>
